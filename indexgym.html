<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0e13" media="(prefers-color-scheme: dark)">
<title>Trainingstracker</title>
<link rel="apple-touch-icon" id="touchIcon" href="">
<style>
:root{--bg:#f4f6f9;--surface:#fff;--surface2:#f7f9fc;--text:#0f172a;--muted:#64748b;--line:#e3e8ef;--accent:#2f5bea;--accentSoft:#edf1fe;--good:#15803d;--goodSoft:#eaf7ef;--bad:#c0262d;--badSoft:#fdf0f0;--gold:#b7791f;--goldSoft:#fbf3e2;--shadow:0 1px 2px rgba(15,23,42,.05),0 2px 8px rgba(15,23,42,.035)}
@media (prefers-color-scheme: dark){:root{--bg:#0b0e13;--surface:#141820;--surface2:#1a1f29;--text:#e8ecf2;--muted:#8b95a7;--line:#262c38;--accent:#6b8cff;--accentSoft:#1b2340;--good:#4ade80;--goodSoft:#10261a;--bad:#f87171;--badSoft:#2c1515;--gold:#f2c14e;--goldSoft:#2c2412;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{overscroll-behavior-y:none}
main{width:100%;max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 104px);overflow-x:hidden}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:28px;line-height:1.15;font-weight:750;letter-spacing:-.02em;margin:2px 0 4px}
.sub{color:var(--muted);font-size:14px}
.sec{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:26px 2px 8px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.ttl{font-weight:700;font-size:16px}
.row{display:flex;align-items:center;min-width:0}.gap{gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.mt{margin-top:12px}.grow{flex:1;min-width:0}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer;color:var(--text);background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:disabled{opacity:.35}
button.primary{background:var(--accent);color:#fff;font-weight:650}
button.ghost{background:var(--surface);border:1px solid var(--line)}
button.danger{color:var(--bad);background:transparent;border:1px solid var(--line)}
button.link{background:none;padding:6px 0;color:var(--accent);font-weight:600}
button.chip{padding:6px 10px;font-size:13px;border-radius:8px;background:var(--accentSoft);color:var(--accent);font-weight:600}
button.icon{padding:7px;background:transparent;border:1px solid var(--line);border-radius:9px}
button.icon svg{width:17px;height:17px}
button.small{padding:7px 11px;font-size:14px}
button.full{width:100%}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type=date]{display:block;min-height:42px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input::placeholder{color:var(--muted);opacity:.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.field{display:block;margin:10px 0;min-width:0}.field>span{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--accentSoft);color:var(--accent);white-space:nowrap}
.badge.gold{background:var(--goldSoft);color:var(--gold)}
.badge.good{background:var(--goodSoft);color:var(--good)}
.badge.bad{background:var(--badSoft);color:var(--bad)}
.pr{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:2px 5px;border-radius:5px;background:var(--goldSoft);color:var(--gold)}
.banner{border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--accentSoft);display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.warn{background:var(--goldSoft)}
/* Trainingstage */
.day{display:block;width:100%;text-align:left;padding:14px 14px 14px 18px;position:relative;overflow:hidden}
.day::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--dc,var(--accent))}
.day .name{font-weight:700;font-size:16.5px}
.day.hl{border-color:var(--dc,var(--accent));box-shadow:0 0 0 1px var(--dc,var(--accent)),var(--shadow)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:13px;margin-top:5px}
/* Training erfassen */
.ex .exhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exname{font-weight:700;font-size:16.5px;overflow-wrap:anywhere}
.ex .chip{white-space:nowrap}
.last{margin:8px 0 4px;color:var(--muted);font-size:13px;padding:7px 9px;background:var(--surface2);border-radius:8px}
.sethead,.setrow{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 30px 30px;gap:6px;align-items:center}
.sethead{margin-top:10px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.setrow{margin-top:6px}
.setno{text-align:center;font-weight:700;color:var(--muted);font-size:14px}
.prb{text-align:center}
.rm{padding:6px;background:none;color:var(--muted)}.rm svg{width:16px;height:16px}
.wdchips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wdc{padding:7px 0;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px}
.wdc.on{background:var(--accent);border-color:var(--accent);color:#fff}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:10px;justify-content:center;z-index:5}
.savebar button{flex:1;max-width:300px}
/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;min-width:0;background:none;border-radius:0;padding:8px 2px 9px;font-size:10.5px;font-weight:600;color:var(--muted);flex-direction:column;gap:3px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--accent)}
/* Fortschritt */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;margin:10px 0}
.seg button{padding:7px 2px;font-size:12.5px;background:none;border-radius:7px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.1)}
canvas{width:100%;height:220px;display:block}
.stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface2);border-radius:10px;padding:10px 11px}
.stat .v{font-size:18px;font-weight:750;letter-spacing:-.01em}.stat .l{font-size:12px;color:var(--muted)}
.ovr{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;gap:10px}
.ovr:last-child{border-bottom:0}
.up{color:var(--good)}.down{color:var(--bad)}
/* Kalender */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.calhead .m{font-size:18px;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wdh{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);padding:2px 0 4px}
.cc{min-height:52px;padding:5px 1px 4px;border-radius:9px;background:var(--surface);border:1px solid var(--line);flex-direction:column;justify-content:flex-start;gap:4px}
.cc .n{font-size:13px;font-weight:600;width:22px;height:22px;display:grid;place-items:center;border-radius:999px}
.cc.out{opacity:.35}
.cc.today .n{background:var(--accent);color:#fff}
.cc.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.ring{background:transparent!important;border:2px solid}
.dot.missed{border-color:var(--bad)!important;position:relative}
.dot.moved{border-style:dotted}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ditem{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ditem:last-child{border-bottom:0}
.ditem .bar{width:4px;align-self:stretch;border-radius:4px}
/* Einstellungen */
.exedit{display:grid;grid-template-columns:minmax(0,1fr) 54px 62px;gap:6px;align-items:center}
.exlist .item{border-top:1px solid var(--line);padding:9px 0 2px}
.exlist .ctl{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.colhead{display:grid;grid-template-columns:minmax(0,1fr) 54px 62px;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:12px}
/* Modal / Toast */
.modal{position:fixed;inset:0;background:rgba(10,14,20,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal .sheet{background:var(--surface);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:22px 16px calc(env(safe-area-inset-bottom) + 18px);max-height:85vh;overflow:auto}
.prline{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 12px;margin:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 86px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;white-space:nowrap}
.empty{text-align:center;padding:34px 12px;color:var(--muted)}
.hist .ln{font-size:14px;margin:4px 0}
.iconhead{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--goldSoft);color:var(--gold);margin-bottom:10px}
.iconhead svg{width:24px;height:24px}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<input type="file" id="importFile" accept=".json,application/json" style="display:none">
<script>
(function(){
const KEY='trainingstracker_v1';
const IC={
 dumbbell:'<svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>',
 cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
 chart:'<svg viewBox="0 0 24 24"><path d="M4 19.5h16"/><path d="M5 15l4.5-4.5 3.5 3 6-6.5"/><path d="M15 7h4v4"/></svg>',
 list:'<svg viewBox="0 0 24 24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r=".8"/><circle cx="4.5" cy="12" r=".8"/><circle cx="4.5" cy="17.5" r=".8"/></svg>',
 gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>',
 trophy:'<svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8.5 20.5h7M10 17h4"/></svg>',
 left:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
 right:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
 x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 up:'<svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>',
 down:'<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 file:'<svg viewBox="0 0 24 24"><path d="M14 3.5H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"/><path d="M14 3.5v5h5M9 13h6M9 16.5h6"/></svg>',
 check:'<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};
const DAYCOL=['#2f5bea','#0f9b8e','#d9480f','#7c3aed','#c2255c','#2b8a3e','#e67700','#1c7ed6'];
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'],WDL=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const MON=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=n=>String(n||'').trim().toLowerCase();
const num=v=>{const x=parseFloat(String(v??'').replace(',','.'));return isNaN(x)?NaN:x;};
const e1rm=(w,r)=>(w>0&&r>0)?(r===1?w:w*(1+r/30)):0;
const fmt=n=>(Math.round(n*10)/10).toLocaleString('de-AT');
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromISO=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const todayISO=()=>toISO(new Date());
const wdOf=iso=>(fromISO(iso).getDay()+6)%7;
const addDays=(iso,n)=>{const d=fromISO(iso);d.setDate(d.getDate()+n);return toISO(d);};
const mondayOf=iso=>addDays(iso,-wdOf(iso));
const daysBetween=(a,b)=>Math.round((fromISO(b)-fromISO(a))/864e5);
const fmtDate=iso=>{const[y,m,d]=iso.split('-');return `${d}.${m}.${y}`;};
const shortDate=iso=>{const[,m,d]=iso.split('-');return `${d}.${m}.`;};
const setStr=s=>s.w>0?`${fmt(s.w)}×${s.r}`:`${s.r} Wdh.`;

const DEFAULT_DAYS=[
 ['Oberkörper A',[0],[['Bankdrücken',4,'8'],['Langhantelrudern',4,'8'],['Schulterdrücken',3,'10'],['Latzug',3,'10'],['Trizepsdrücken am Kabel',3,'12']]],
 ['Unterkörper A',[1],[['Kniebeuge',4,'6'],['Rumänisches Kreuzheben',3,'8'],['Beinpresse',3,'10'],['Beinbeuger',3,'12'],['Wadenheben',3,'15']]],
 ['Oberkörper B',[3],[['Schrägbankdrücken Kurzhantel',4,'10'],['Klimmzüge',4,'6'],['Seitheben',3,'15'],['Kabelrudern',3,'10'],['Bizepscurls',3,'12']]],
 ['Unterkörper B',[4],[['Kreuzheben',3,'5'],['Ausfallschritte',3,'10'],['Beinstrecker',3,'12'],['Hip Thrust',3,'10'],['Crunches an der Maschine',3,'15']]]
];
function defaultState(){const pf=mondayOf(todayISO());return{v:2,days:DEFAULT_DAYS.map(([n,wd,ex])=>({id:uid(),name:n,weekdays:wd,planFrom:pf,exercises:ex.map(([name,sets,reps])=>({id:uid(),name,sets,reps}))})),sessions:[],draft:null,lastBackup:null};}
function migrate(s){s.v=2;s.days.forEach(d=>{if(!Array.isArray(d.weekdays))d.weekdays=[];if(d.planFrom===undefined)d.planFrom=d.weekdays.length?mondayOf(todayISO()):null;if(!Array.isArray(d.exercises))d.exercises=[];});s.sessions.forEach(x=>{if(!x.prs)x.prs=[];if(!x.ts)x.ts=Date.now();});return s;}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Array.isArray(s.days)&&Array.isArray(s.sessions))return migrate(s);}catch(e){}return defaultState();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
let view=S.draft?'workout':'home',chartEx=null,chartMetric=null,calMonth=null,calSel=todayISO(),pdfDay=null,pdfMonths=3;
const app=document.getElementById('app'),nav=document.getElementById('nav');
const TABS=[['home','Training','dumbbell'],['calendar','Kalender','cal'],['progress','Fortschritt','chart'],['history','Verlauf','list'],['settings','Einstellungen','gear']];
nav.innerHTML=TABS.map(([k,l,i])=>`<button data-nav="${k}">${IC[i]}${l}</button>`).join('');

/* ---------- Daten-Helfer ---------- */
function findDay(id){return S.days.find(d=>d.id===id);}
function dayColor(id){const i=S.days.findIndex(d=>d.id===id);return i<0?'#94a3b8':DAYCOL[i%DAYCOL.length];}
function sortedSessions(){return[...S.sessions].sort((a,b)=>a.date===b.date?a.ts-b.ts:(a.date<b.date?-1:1));}
function exHistory(name,excludeId){const k=key(name),out=[];for(const s of sortedSessions()){if(s.id===excludeId)continue;for(const e of s.exercises){if(key(e.name)===k&&e.sets.length)out.push({s,sets:e.sets});}}return out;}
function prevStats(name,excludeId){const all=exHistory(name,excludeId).flatMap(x=>x.sets);return{n:all.length,sets:all,maxW:Math.max(0,...all.map(x=>x.w)),maxE:Math.max(0,...all.map(x=>e1rm(x.w,x.r))),maxR:Math.max(0,...all.map(x=>x.r))};}
function repsAt(st,w){let m=-1;for(const s of st.sets)if(s.w>=w-1e-9&&s.r>m)m=s.r;return m;}
function setPR(st,w,r){if(!st.n||!(r>0))return[];const t=[];if(w>0&&w>st.maxW+1e-9)t.push('w');else{const ra=repsAt(st,w);if(ra>=0&&r>ra)t.push('r');}if(!t.includes('w')&&w>0&&e1rm(w,r)>st.maxE+0.05)t.push('e');return t;}
function lastSets(name){const h=exHistory(name);return h.length?h[h.length-1]:null;}
function rotationNext(){if(!S.days.length)return null;const ss=sortedSessions();if(!ss.length)return S.days[0].id;const idx=S.days.findIndex(d=>d.id===ss[ss.length-1].dayId);return S.days[(idx+1)%S.days.length].id;}
function lastDoneDate(dayId){const ss=sortedSessions().filter(s=>s.dayId===dayId);return ss.length?ss[ss.length-1].date:null;}
function allExerciseNames(withHistoryOnly){const m=new Map();for(const s of sortedSessions())for(const e of s.exercises)m.set(key(e.name),e.name);if(!withHistoryOnly)for(const d of S.days)for(const e of d.exercises)if(!m.has(key(e.name)))m.set(key(e.name),e.name);return[...m.values()];}
function isBodyweight(name){return prevStats(name).maxW===0;}
function sessMetric(sets,metric){if(metric==='top')return Math.max(...sets.map(x=>x.w));if(metric==='e1rm')return Math.max(...sets.map(x=>e1rm(x.w,x.r)));if(metric==='vol')return sets.reduce((a,x)=>a+x.w*x.r,0);if(metric==='maxr')return Math.max(...sets.map(x=>x.r));return sets.reduce((a,x)=>a+x.r,0);}
function seriesFor(name,metric){return exHistory(name).map(({s,sets})=>({d:s.date,v:sessMetric(sets,metric)}));}
function trendFor(name){const metric=isBodyweight(name)?'reps':'e1rm';const p=seriesFor(name,metric).map(x=>x.v);const n=p.length;if(n<2)return{arrow:'•',cls:'muted',txt:'Noch zu wenig Daten'};const k=Math.max(1,Math.min(3,Math.floor(n/2)));const now=avg(p.slice(-k)),before=avg(p.slice(-2*k,-k));const pct=before>0?(now-before)/before*100:0;const lbl=k===1?'vs. letztes Mal':`letzte ${k} vs. ${k} davor`;if(pct>1)return{arrow:'▲',cls:'up',txt:`Steigerung +${fmt(pct)} % (${lbl})`};if(pct<-1)return{arrow:'▼',cls:'down',txt:`Rückgang ${fmt(pct)} % (${lbl})`};return{arrow:'▶',cls:'muted',txt:`Stabil ${pct>=0?'+':''}${fmt(pct)} % (${lbl})`};}

/* ---------- Planung (Soll/Ist) ---------- */
function planStatus(from,to){
  const start=mondayOf(from),end=addDays(mondayOf(to),6),today=todayISO();
  const sess=S.sessions.filter(s=>s.date>=start&&s.date<=end),used=new Set(),occ=[];
  for(let w=start;w<=end;w=addDays(w,7)){
    const wEnd=addDays(w,6),wocc=[];
    for(let i=0;i<7;i++){const date=addDays(w,i);for(const d of S.days)if(d.weekdays.includes(i)&&d.planFrom&&date>=d.planFrom)wocc.push({date,dayId:d.id});}
    const ws=sess.filter(s=>s.date>=w&&s.date<=wEnd).sort((a,b)=>a.ts-b.ts);
    for(const o of wocc){const s=ws.find(s=>!used.has(s.id)&&s.dayId===o.dayId&&s.date===o.date);if(s){used.add(s.id);o.status='done';o.actual=s.date;}}
    for(const o of wocc){if(o.status)continue;const s=ws.find(s=>!used.has(s.id)&&s.dayId===o.dayId);if(s){used.add(s.id);o.status='moved';o.actual=s.date;}else o.status=o.date<today?'missed':(o.date===today?'today':'planned');}
    occ.push(...wocc);
  }
  const inR=x=>x.date>=from&&x.date<=to;
  return{occ:occ.filter(inR),extra:sess.filter(s=>!used.has(s.id)&&inR(s)),sess:sess.filter(inR)};
}
function weekdayText(d){return d.weekdays.length?[...d.weekdays].sort().map(i=>WD[i]).join(' · '):'kein fixer Tag';}
function toggleWeekday(dayId,i){const d=findDay(dayId);if(!d)return;const k=d.weekdays.indexOf(i);if(k>=0)d.weekdays.splice(k,1);else d.weekdays.push(i);if(!d.planFrom)d.planFrom=mondayOf(todayISO());save();render();}
function wdChips(d){return `<div class="wdchips">${WD.map((w,i)=>`<button class="wdc ${d.weekdays.includes(i)?'on':''}" data-act="wd" data-d="${d.id}" data-w="${i}">${w}</button>`).join('')}</div>`;}

/* ---------- Ansichten ---------- */
function render(){
  nav.style.display=view==='workout'?'none':'flex';
  nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.nav===view));
  if(view==='workout')app.innerHTML=renderWorkout();
  else if(view==='calendar')app.innerHTML=renderCalendar();
  else if(view==='progress'){app.innerHTML=renderProgress();drawCurrentChart();}
  else if(view==='history')app.innerHTML=renderHistory();
  else if(view==='settings')app.innerHTML=renderSettings();
  else app.innerHTML=renderHome();
}

function renderHome(){
  const t=todayISO(),wk=planStatus(mondayOf(t),addDays(mondayOf(t),6));
  const todayPlan=wk.occ.filter(o=>o.date===t&&o.status==='today').map(o=>o.dayId);
  const nid=todayPlan.length?null:rotationNext();
  const doneW=wk.sess.length,plannedW=wk.occ.length;
  const d=new Date();
  let h=`<div class="sub">${WDL[wdOf(t)]}, ${d.getDate()}. ${MON[d.getMonth()]}</div><h1>Training</h1>
  <div class="card row between"><div><div class="tiny muted" style="font-weight:600;text-transform:uppercase;letter-spacing:.05em">Diese Woche</div><div style="font-size:20px;font-weight:750">${doneW}${plannedW?` <span class="muted" style="font-size:15px;font-weight:600">von ${plannedW} geplant</span>`:` <span class="muted" style="font-size:15px;font-weight:600">${doneW===1?'Training':'Trainings'}</span>`}</div></div>${plannedW?`<div class="badge ${doneW>=plannedW?'good':''}">${Math.round(Math.min(1,doneW/plannedW)*100)} %</div>`:''}</div>`;
  if(S.draft)h+=`<div class="banner"><div><b>Laufendes Training</b><div class="small">${esc(S.draft.dayName)}</div></div><button class="primary small" data-act="resume">Fortsetzen</button></div>`;
  const days=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):null;
  if(S.sessions.length&&(days===null||days>=7))h+=`<div class="banner warn"><div class="small"><b>Sicherung empfohlen</b><br>${days===null?'Noch keine Sicherung erstellt.':`Letzte Sicherung vor ${days} Tagen.`}</div><button class="ghost small" data-act="export">Sichern</button></div>`;
  h+=`<div class="sec">Trainingstage</div>`;
  if(!S.days.length)h+=`<div class="empty">Noch keine Trainingstage.<br><button class="primary mt" data-nav="settings">Tag anlegen</button></div>`;
  S.days.forEach(dd=>{const ld=lastDoneDate(dd.id),isToday=todayPlan.includes(dd.id),isNext=dd.id===nid;
    h+=`<button class="card day ${isToday||isNext?'hl':''}" style="--dc:${dayColor(dd.id)}" data-act="start" data-d="${dd.id}"><div class="row between gap"><span class="name grow">${esc(dd.name)}</span>${isToday?'<span class="badge">Heute geplant</span>':isNext?'<span class="badge">Als Nächstes</span>':''}</div>
    <div class="meta"><span>${dd.exercises.length} Übungen</span><span>Plan: ${weekdayText(dd)}</span><span>${ld?'Zuletzt '+fmtDate(ld):'Noch nie trainiert'}</span></div></button>`;});
  const recent=sortedSessions().reverse().flatMap(s=>(s.prs||[]).map(p=>({...p,date:s.date}))).slice(0,4);
  if(recent.length){h+=`<div class="sec">Letzte Rekorde</div><div class="card">`+recent.map(p=>`<div class="ditem"><span class="pr">PR</span><div class="grow"><b>${esc(p.ex)}</b> <span class="muted small">· ${shortDate(p.date)}</span><div class="small muted">${esc(p.text)}</div></div></div>`).join('')+`</div>`;}
  return h;
}

function renderCalendar(){
  if(!calMonth)calMonth=todayISO().slice(0,7);
  const[y,m]=calMonth.split('-').map(Number),first=`${calMonth}-01`,last=`${calMonth}-${pad(new Date(y,m,0).getDate())}`;
  const gStart=mondayOf(first),gEnd=addDays(mondayOf(last),6),ps=planStatus(gStart,gEnd),t=todayISO();
  const mo=ps.occ.filter(o=>o.date>=first&&o.date<=last),ms=ps.sess.filter(s=>s.date>=first&&s.date<=last);
  const due=mo.filter(o=>o.date<=t&&o.status!=='today'||o.status==='done'||o.status==='moved'),ful=due.filter(o=>o.status==='done'||o.status==='moved');
  const missed=mo.filter(o=>o.status==='missed').length;
  let h=`<h1>Kalender</h1><div class="sub">Geplante und absolvierte Trainings</div>`;
  if(!S.days.some(d=>d.weekdays.length))h+=`<div class="banner"><div class="small">Lege fest, an welchen Wochentagen du trainierst – direkt im Trainingstag oder in den Einstellungen.</div></div>`;
  h+=`<div class="card"><div class="calhead"><button class="icon" data-act="calprev">${IC.left}</button><span class="m">${MON[m-1]} ${y}</span><button class="icon" data-act="calnext">${IC.right}</button></div><div class="cal">${WD.map(w=>`<div class="wdh">${w}</div>`).join('')}`;
  for(let dt=gStart;dt<=gEnd;dt=addDays(dt,1)){
    const occ=ps.occ.filter(o=>o.date===dt&&o.status!=='done'),ss=ps.sess.filter(s=>s.date===dt);
    const dots=ss.map(s=>`<i class="dot" style="background:${dayColor(s.dayId)}"></i>`).concat(occ.map(o=>`<i class="dot ring ${o.status==='missed'?'missed':o.status==='moved'?'moved':''}" style="border-color:${dayColor(o.dayId)}"></i>`)).join('');
    h+=`<button class="cc ${dt.slice(0,7)!==calMonth?'out':''} ${dt===t?'today':''} ${dt===calSel?'sel':''}" data-act="calsel" data-date="${dt}"><span class="n">${+dt.slice(8)}</span><span class="dots">${dots}</span></button>`;}
  h+=`</div><div class="legend"><span><i class="dot" style="background:var(--muted)"></i>absolviert</span><span><i class="dot ring" style="border-color:var(--muted)"></i>geplant</span><span><i class="dot ring missed"></i>verpasst</span><span><i class="dot ring moved" style="border-color:var(--muted)"></i>verschoben</span></div>
  <div class="legend">${S.days.map(d=>`<span><i class="dot" style="background:${dayColor(d.id)}"></i>${esc(d.name)}</span>`).join('')}</div></div>`;
  h+=`<div class="stats"><div class="stat"><div class="v">${ms.length}</div><div class="l">Trainings im ${MON[m-1]}</div></div><div class="stat"><div class="v">${due.length?Math.round(ful.length/due.length*100)+' %':'–'}</div><div class="l">Planerfüllung (${ful.length}/${due.length})</div></div><div class="stat"><div class="v">${mo.length}</div><div class="l">Geplant im Monat</div></div><div class="stat"><div class="v ${missed?'down':''}">${missed}</div><div class="l">Verpasst</div></div></div>`;
  // Tagesdetail
  const sd=calSel,socc=ps.occ.filter(o=>o.date===sd),sss=ps.sess.filter(s=>s.date===sd);
  h+=`<div class="sec">${WDL[wdOf(sd)]}, ${fmtDate(sd)}</div><div class="card">`;
  const items=[];
  socc.forEach(o=>{const dd=findDay(o.dayId);const st={done:['Absolviert','good'],moved:[`Verschoben – absolviert am ${o.actual?shortDate(o.actual):''}`,''],missed:['Verpasst','bad'],today:['Heute geplant',''],planned:['Geplant','']}[o.status];
    if(o.status==='done')return;
    items.push(`<div class="ditem"><span class="bar" style="background:${dayColor(o.dayId)}"></span><div class="grow"><b>${esc(dd?dd.name:'Training')}</b><div class="small"><span class="badge ${st[1]}">${st[0]}</span></div></div>${(o.status==='today'||o.status==='planned'&&o.date===t)?`<button class="primary small" data-act="start" data-d="${o.dayId}">Starten</button>`:''}</div>`);});
  sss.forEach(s=>{const o=ps.occ.find(o=>o.actual===s.date&&o.dayId===s.dayId);const lbl=!o?'Zusätzlich absolviert':o.status==='moved'?`Absolviert (geplant am ${shortDate(o.date)})`:'Absolviert – planmäßig';
    items.push(`<div class="ditem"><span class="bar" style="background:${dayColor(s.dayId)}"></span><div class="grow"><b>${esc(s.dayName)}</b><div class="small"><span class="badge good">${lbl}</span>${s.prs.length?` <span class="pr">${s.prs.length} PR</span>`:''}</div><div class="small muted" style="margin-top:4px">${s.exercises.map(e=>`${esc(e.name)} ${e.sets.map(setStr).join(', ')}`).join(' · ')}</div></div></div>`);});
  h+=(items.length?items.join(''):`<div class="muted small">Kein Training an diesem Tag.</div>`)+`</div>`;
  return h;
}

function analyze(name,sess){
  const k=key(name),rows=[];
  sess.forEach(s=>{const e=s.exercises.find(x=>key(x.name)===k);if(!e)return;rows.push({date:s.date,sets:e.sets,top:sessMetric(e.sets,'top'),e1:sessMetric(e.sets,'e1rm'),vol:sessMetric(e.sets,'vol'),reps:sessMetric(e.sets,'reps'),maxr:sessMetric(e.sets,'maxr'),prs:(s.prs||[]).filter(p=>key(p.ex)===k).length});});

  if(n>=3&&span>0){const rg=regress(rows.map(r=>daysBetween(rows[0].date,r.date)),ys);a.perWeek=rg.b*7;a.pctMonth=rg.my>0?rg.b*30/rg.my*100:0;a.r2=rg.r2;}
  else if(n===2&&span>0){a.perWeek=(a.lastV-a.firstV)/span*7;a.pctMonth=a.totalPct/(span/30);}
  if(n<2||a.pctMonth===undefined){a.rating='Zu wenig Daten';a.rk=0;}
  else if(a.pctMonth>1.5){a.rating='Steigerung';a.rk=1;}
  else if(a.pctMonth<-1.5){a.rating='Rückgang';a.rk=-1;}
  else{a.rating='Stagnation';a.rk=0;}
  return a;
}

function startDay(dayId){

  save();view='workout';render();window.scrollTo(0,0);
}
function saveWorkout(){
  const d=S.draft,exs=[];
  for(const e of d.ex){const sets=e.rows.map(r=>{const w=num(r.w);return{w:isNaN(w)?0:w,r:parseInt(r.r,10)};}).filter(x=>x.r>0);if(sets.length)exs.push({name:e.name.trim(),sets});}
  if(!exs.length){alert('Bitte mindestens einen Satz mit Wiederholungen eintragen.');return;}
  const prs=[];
  for(const e of exs){const st=prevStats(e.name);if(!st.n)continue;
    const mW=Math.max(...e.sets.map(s=>s.w)),wPR=mW>0&&mW>st.maxW+1e-9;
    if(wPR)prs.push({ex:e.name,t:'w',text:`Neues Bestgewicht: ${fmt(mW)} kg (vorher ${fmt(st.maxW)} kg)`});
    let best=null;for(const s of e.sets){const ra=repsAt(st,s.w);if(ra>=0&&s.r>ra&&(!best||s.w>best.w||(s.w===best.w&&s.r>best.r)))best={...s,prev:ra};}
    if(best)prs.push({ex:e.name,t:'r',text:best.w>0?`Wiederholungsrekord: ${fmt(best.w)} kg × ${best.r} (vorher max. ${best.prev} Wdh. bei diesem Gewicht)`:`Wiederholungsrekord: ${best.r} Wdh. (vorher ${best.prev})`});
    const mE=Math.max(...e.sets.map(s=>e1rm(s.w,s.r)));if(!wPR&&mE>st.maxE+0.05)prs.push({ex:e.name,t:'e',text:`Neues geschätztes 1RM: ${fmt(mE)} kg (vorher ${fmt(st.maxE)} kg)`});}
  const sess={id:uid(),ts:Date.now(),date:d.date||todayISO(),dayId:d.dayId,dayName:d.dayName,exercises:exs,note:(d.note||'').trim(),prs};
  S.sessions.push(sess);S.draft=null;save();view='home';render();window.scrollTo(0,0);showSummary(sess);
}

    if(!prev){h+=`<div class="ovr" style="cursor:default"><b>${esc(e.name)}</b><span class="muted small">erstes Mal</span></div>`;return;}
    const pv=prev.sets.reduce((a,s)=>a+(s.w>0?s.w*s.r:s.r),0),pct=pv>0?(vol-pv)/pv*100:0;
    h+=`<div class="ovr" style="cursor:default"><b>${esc(e.name)}</b><span class="${pct>1?'up':pct<-1?'down':'muted'}" style="font-weight:700">${pct>=0?'+':''}${fmt(pct)} %</span></div>`;});
  h+=`</div><button class="primary full mt" data-act="closemodal">Fertig</button></div>`;
  const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=h;document.body.appendChild(m);
}
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200);}
async function shareOrDownload(blob,name,type,title){
  try{const file=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return true;}}catch(e){if(e&&e.name==='AbortError')return false;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);return true;
}
async function exportData(){
  const ok=await shareOrDownload(new Blob([JSON.stringify({app:'trainingstracker',exported:new Date().toISOString(),...S})],{type:'application/json'}),`trainingstracker-backup-${todayISO()}.json`,'application/json','Trainingstracker-Sicherung');
  if(ok){S.lastBackup=Date.now();save();render();toast('Sicherung erstellt');}
}
document.getElementById('importFile').addEventListener('change',ev=>{
  const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!Array.isArray(o.days)||!Array.isArray(o.sessions))throw 0;
    if(!confirm(`Sicherung mit ${o.days.length} Trainingstagen und ${o.sessions.length} Trainings laden?\nDie aktuellen Daten auf diesem Gerät werden ersetzt.`))return;
    S=migrate({days:o.days,sessions:o.sessions,draft:o.draft||null,lastBackup:o.lastBackup||Date.now()});save();view='home';render();toast('Sicherung geladen');}
    catch(e){alert('Diese Datei ist keine gültige Trainingstracker-Sicherung.');}};
  rd.readAsText(f);ev.target.value='';
});
function move(arr,i,dir){const j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];}

document.addEventListener('click',ev=>{
  const n=ev.target.closest('[data-nav]');if(n){view=n.dataset.nav;render();window.scrollTo(0,0);return;}
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,d=S.draft,i=+b.dataset.i;
  const day=b.dataset.d?findDay(b.dataset.d):null,exI=day&&b.dataset.e?day.exercises.findIndex(e=>e.id===b.dataset.e):-1;
  switch(a){
    case'start':startDay(b.dataset.d);break;
    case'resume':view='workout';render();window.scrollTo(0,0);break;
    case'back':view='home';render();window.scrollTo(0,0);break;
    case'addset':{const rows=d.ex[i].rows;rows.push({w:rows.length?rows[rows.length-1].w:'',r:''});save();render();break;}
    case'rmset':d.ex[i].rows.splice(+b.dataset.j,1);save();render();break;
    case'rmex':if(confirm(`„${d.ex[i].name}“ heute auslassen?`)){d.ex.splice(i,1);save();render();}break;
    case'addex':{const nm=(prompt('Name der Übung:')||'').trim();if(!nm)break;d.ex.push({name:nm,sets:3,reps:'10',rows:[{w:'',r:''},{w:'',r:''},{w:'',r:''}]});
      const pd=findDay(d.dayId);if(pd&&!pd.exercises.some(e=>key(e.name)===key(nm))&&confirm(`„${nm}“ auch dauerhaft in den Plan von „${pd.name}“ aufnehmen?`))pd.exercises.push({id:uid(),name:nm,sets:3,reps:'10'});
      save();render();setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),50);break;}
    case'copylast':{const last=lastSets(d.ex[i].name);if(!last)break;d.ex[i].rows.forEach((r,j)=>{const s=last.sets[j]||last.sets[last.sets.length-1];if(r.w===''&&s.w>0)r.w=String(s.w).replace('.',',');});save();render();break;}
    case'discard':if(confirm('Dieses Training verwerfen? Die Einträge gehen verloren.')){S.draft=null;save();view='home';render();}break;
    case'saveworkout':saveWorkout();break;
    case'closemodal':document.getElementById('modal')?.remove();break;
    case'wd':toggleWeekday(b.dataset.d,+b.dataset.w);break;
    case'calprev':case'calnext':{const[y,m]=calMonth.split('-').map(Number);const dt=new Date(y,m-1+(a==='calnext'?1:-1),1);calMonth=toISO(dt).slice(0,7);render();break;}
    case'calsel':calSel=b.dataset.date;if(calSel.slice(0,7)!==calMonth)calMonth=calSel.slice(0,7);render();break;
    case'metric':chartMetric=b.dataset.m;render();break;
    case'pickex':chartEx=b.dataset.n;chartMetric=null;render();window.scrollTo(0,0);break;
    case'pdf':makePDF();break;
    case'delsession':if(confirm('Dieses Training endgültig löschen?')){S.sessions=S.sessions.filter(s=>s.id!==b.dataset.id);save();render();}break;
    case'exadd':day.exercises.push({id:uid(),name:'Neue Übung',sets:3,reps:'10'});save();render();break;
    case'exdel':if(confirm(`„${day.exercises[exI].name}“ aus ${day.name} entfernen? Der bisherige Verlauf bleibt erhalten.`)){day.exercises.splice(exI,1);save();render();}break;
    case'exup':move(day.exercises,exI,-1);save();render();break;
    case'exdown':move(day.exercises,exI,1);save();render();break;
    case'dayadd':S.days.push({id:uid(),name:`Tag ${S.days.length+1}`,weekdays:[],planFrom:null,exercises:[{id:uid(),name:'Neue Übung',sets:3,reps:'10'}]});save();render();setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),50);break;
    case'daydel':if(confirm(`„${day.name}“ löschen? Gespeicherte Trainings bleiben im Verlauf.`)){S.days=S.days.filter(x=>x.id!==day.id);save();render();}break;
    case'dayup':move(S.days,S.days.indexOf(day),-1);save();render();break;
    case'daydown':move(S.days,S.days.indexOf(day),1);save();render();break;
    case'export':exportData();break;
    case'import':document.getElementById('importFile').click();break;
    case'reset':if(confirm('Wirklich ALLE Daten löschen? Das kann nicht rückgängig gemacht werden.')&&confirm('Letzte Bestätigung: alles löschen?')){S=defaultState();save();view='home';render();}break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target,d=S.draft;
  if(t.dataset.f&&d){const i=+t.dataset.i,j=+t.dataset.j;d.ex[i].rows[j][t.dataset.f]=t.value;save();const el=document.getElementById(`pr-${i}-${j}`);if(el)el.innerHTML=prBadge(prevStats(d.ex[i].name),d.ex[i].rows[j]);}
  else if(t.id==='wnote'&&d){d.note=t.value;save();}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='wdate'&&S.draft){S.draft.date=t.value||todayISO();save();render();return;}
  if(t.id==='exsel'){chartEx=t.value;chartMetric=null;render();return;}
  if(t.id==='pdfDay'){pdfDay=t.value;return;}
  if(t.id==='pdfMonths'){pdfMonths=+t.value;return;}
  if(!t.dataset.s)return;const day=findDay(t.dataset.d);if(!day)return;
  if(t.dataset.s==='dayname'){day.name=t.value.trim()||day.name;}
  else{const e=day.exercises.find(x=>x.id===t.dataset.e);if(!e)return;
    if(t.dataset.s==='exname')e.name=t.value.trim()||e.name;
    if(t.dataset.s==='exsets')e.sets=Math.max(1,parseInt(t.value,10)||1);
    if(t.dataset.s==='exreps')e.reps=t.value.trim()||e.reps;}
  save();toast('Gespeichert');
});
let rt,lastW=window.innerWidth;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(window.innerWidth!==lastW){lastW=window.innerWidth;if(view==='progress')drawCurrentChart();}},150);});

/* App-Icon für den Home-Bildschirm */
try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0f172a';x.fillRect(0,0,180,180);x.fillStyle='#2f5bea';x.fillRect(0,150,180,30);x.fillStyle='#fff';
  x.fillRect(48,82,84,12);[[30,58,14,60],[50,48,14,80],[116,48,14,80],[136,58,14,60]].forEach(r=>{x.beginPath();x.roundRect?x.roundRect(...r,4):x.rect(...r);x.fill();});
  document.getElementById('touchIcon').href=c.toDataURL('image/png');}catch(e){}

save();render();
})();
</script>
